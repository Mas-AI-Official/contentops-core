<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ContentOps — AI Media Agency</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a1a; color: #e0e0e0; overflow-x: hidden; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0a0a1a; }
    ::-webkit-scrollbar-thumb { background: #2a2f3e; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #3a4050; }

    .app-layout { display: flex; min-height: 100vh; }

    /* --- Sidebar --- */
    .sidebar { width: 240px; background: #0d0d20; border-right: 1px solid #1e2130; display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 50; transition: width 0.2s, transform 0.2s; }
    .sidebar.collapsed { width: 60px; }
    .sidebar.collapsed .nav-label, .sidebar.collapsed .brand-sub, .sidebar.collapsed .sidebar-footer span { display: none; }
    .sidebar.collapsed .brand-name { font-size: 14px; }
    .sidebar .brand { padding: 20px 16px; border-bottom: 1px solid #1e2130; }
    .sidebar .brand-name { font-size: 20px; font-weight: 700; color: #00c8ff; white-space: nowrap; }
    .sidebar .brand-sub { font-size: 11px; color: #6b7a8d; margin-top: 2px; white-space: nowrap; }
    .sidebar nav { flex: 1; padding: 12px 8px; }
    .sidebar .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; color: #8899aa; transition: all 0.15s; margin-bottom: 2px; white-space: nowrap; }
    .sidebar .nav-item:hover { background: #151828; color: #c0c8d4; }
    .sidebar .nav-item.active { background: #131730; color: #00c8ff; border-left: 3px solid #00c8ff; }
    .sidebar .nav-item .nav-icon { font-size: 18px; min-width: 24px; text-align: center; }
    .sidebar .sidebar-footer { padding: 12px 16px; border-top: 1px solid #1e2130; font-size: 12px; color: #556; }
    .sidebar .collapse-btn { position: absolute; top: 24px; right: -12px; width: 24px; height: 24px; background: #1e2130; border: 1px solid #2a2f3e; border-radius: 50%; color: #8899aa; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; z-index: 51; }

    /* --- Main Content --- */
    .main-content { flex: 1; margin-left: 240px; transition: margin-left 0.2s; }
    .main-content.expanded { margin-left: 60px; }
    .topbar { background: linear-gradient(135deg, #0f1419 0%, #1a1f2e 100%); padding: 16px 32px; border-bottom: 1px solid #2a2f3e; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 40; }
    .topbar h1 { font-size: 20px; color: #e0e0e0; font-weight: 600; }
    .topbar .status-pill { font-size: 12px; color: #2dd4bf; background: #2dd4bf15; padding: 4px 12px; border-radius: 16px; border: 1px solid #2dd4bf30; }
    .page-content { padding: 24px 32px; max-width: 1400px; }

    /* --- Cards --- */
    .card { background: #12141f; border: 1px solid #2a2f3e; border-radius: 12px; padding: 24px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .card-title { font-size: 16px; font-weight: 600; color: #e0e0e0; }
    .card-subtitle { font-size: 12px; color: #6b7a8d; margin-top: 2px; }

    /* --- Stat Cards --- */
    .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: #12141f; border: 1px solid #2a2f3e; border-radius: 10px; padding: 20px; }
    .stat-card .stat-icon { font-size: 24px; margin-bottom: 8px; }
    .stat-card .stat-value { font-size: 28px; font-weight: 700; color: #00c8ff; }
    .stat-card .stat-label { font-size: 12px; color: #6b7a8d; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }

    /* --- Buttons --- */
    .btn { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: #00c8ff; color: #0a0a1a; }
    .btn-primary:hover:not(:disabled) { background: #00b0e0; }
    .btn-accent { background: #D4A843; color: #0a0a1a; }
    .btn-accent:hover:not(:disabled) { background: #c09838; }
    .btn-teal { background: #2DD4BF; color: #0a0a1a; }
    .btn-teal:hover:not(:disabled) { background: #26b5a3; }
    .btn-secondary { background: #1e2130; color: #c0c8d4; border: 1px solid #2a2f3e; }
    .btn-secondary:hover:not(:disabled) { background: #282d3e; }
    .btn-danger { background: #ff444430; color: #ff6b6b; border: 1px solid #ff444430; }
    .btn-danger:hover:not(:disabled) { background: #ff444450; }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .btn-lg { padding: 12px 24px; font-size: 15px; }
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }

    /* --- Forms --- */
    input, select, textarea { background: #181b28; border: 1px solid #2a2f3e; color: #e0e0e0; padding: 10px 14px; border-radius: 8px; font-size: 14px; width: 100%; font-family: inherit; transition: border-color 0.15s; }
    input:focus, select:focus, textarea:focus { border-color: #00c8ff; outline: none; }
    input::placeholder, textarea::placeholder { color: #4a5568; }
    label { display: block; font-size: 12px; color: #8899aa; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-group { margin-bottom: 16px; }
    .form-row { display: flex; gap: 12px; }
    .form-row > * { flex: 1; }

    /* --- Grid Layouts --- */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .gap-20 { gap: 20px; }
    .mb-20 { margin-bottom: 20px; }
    .mb-12 { margin-bottom: 12px; }

    /* --- Tables --- */
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th { text-align: left; padding: 10px 12px; font-size: 11px; color: #6b7a8d; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #1e2130; }
    .data-table td { padding: 10px 12px; font-size: 13px; border-bottom: 1px solid #1e213050; }
    .data-table tr:hover td { background: #151828; }

    /* --- Tags/Badges --- */
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 16px; font-size: 11px; font-weight: 600; }
    .badge-success { background: #2dd4bf18; color: #2dd4bf; border: 1px solid #2dd4bf30; }
    .badge-warning { background: #D4A84318; color: #D4A843; border: 1px solid #D4A84330; }
    .badge-error { background: #ff444418; color: #ff6b6b; border: 1px solid #ff444430; }
    .badge-info { background: #00c8ff18; color: #00c8ff; border: 1px solid #00c8ff30; }
    .badge-neutral { background: #2a2f3e; color: #8899aa; }

    .platform-badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 16px; font-size: 12px; font-weight: 500; }
    .platform-badge.tiktok { background: #ff005010; color: #ff0050; border: 1px solid #ff005025; }
    .platform-badge.instagram { background: #e1306c10; color: #e1306c; border: 1px solid #e1306c25; }
    .platform-badge.youtube { background: #ff000010; color: #ff4444; border: 1px solid #ff000025; }
    .platform-badge.linkedin { background: #0077b510; color: #0077b5; border: 1px solid #0077b525; }
    .platform-badge.twitter { background: #1da1f210; color: #1da1f2; border: 1px solid #1da1f225; }
    .platform-badge.threads { background: #ffffff10; color: #cccccc; border: 1px solid #ffffff20; }
    .platform-badge.pinterest { background: #e6001910; color: #e60019; border: 1px solid #e6001925; }
    .platform-badge.snapchat { background: #fffc0010; color: #fffc00; border: 1px solid #fffc0025; }

    /* --- Niche Cards --- */
    .niche-card { background: #161829; border: 1px solid #2a2f3e; border-radius: 10px; padding: 20px; margin-bottom: 16px; }
    .niche-card:hover { border-color: #3a4050; }
    .niche-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .niche-name { font-size: 16px; font-weight: 600; }
    .niche-audience { font-size: 12px; color: #6b7a8d; margin-top: 2px; }
    .niche-platforms { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }

    /* --- Modal --- */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 200; }
    .modal { background: #12141f; border: 1px solid #2a2f3e; border-radius: 16px; padding: 28px; min-width: 440px; max-width: 560px; max-height: 90vh; overflow-y: auto; }
    .modal-title { font-size: 18px; font-weight: 600; color: #00c8ff; margin-bottom: 20px; }

    /* --- Loading/Empty States --- */
    .loading-spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid #2a2f3e; border-top-color: #00c8ff; border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; color: #6b7a8d; gap: 12px; }
    .empty-state { text-align: center; padding: 40px; color: #4a5568; }
    .empty-state .empty-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.5; }

    /* --- Schedule Grid --- */
    .schedule-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .schedule-day { text-align: center; background: #161829; border-radius: 8px; padding: 10px 6px; min-height: 80px; }
    .schedule-day .day-label { font-size: 11px; color: #6b7a8d; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .schedule-slot { font-size: 10px; padding: 3px 6px; border-radius: 4px; margin: 3px auto; max-width: 90%; }

    /* --- Tab sub-navigation --- */
    .tab-bar { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 1px solid #1e2130; padding-bottom: 0; }
    .tab-item { padding: 8px 16px; font-size: 13px; color: #6b7a8d; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; }
    .tab-item:hover { color: #c0c8d4; }
    .tab-item.active { color: #00c8ff; border-bottom-color: #00c8ff; }

    /* --- Pipeline result --- */
    .result-box { background: #161829; border: 1px solid #2a2f3e; border-radius: 10px; padding: 16px; margin-top: 16px; }
    .result-box .result-status { font-weight: 600; font-size: 14px; margin-bottom: 8px; }
    .result-box pre { font-size: 12px; color: #8899aa; white-space: pre-wrap; word-break: break-word; max-height: 300px; overflow-y: auto; }

    /* --- Toast --- */
    .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 300; display: flex; flex-direction: column; gap: 8px; }
    .toast { padding: 12px 20px; border-radius: 10px; font-size: 13px; animation: slideIn 0.3s ease; min-width: 280px; }
    .toast-success { background: #2dd4bf20; color: #2dd4bf; border: 1px solid #2dd4bf30; }
    .toast-error { background: #ff444420; color: #ff6b6b; border: 1px solid #ff444430; }
    .toast-info { background: #00c8ff20; color: #00c8ff; border: 1px solid #00c8ff30; }
    @keyframes slideIn { from { transform: translateX(100px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    /* --- Settings key mask --- */
    .key-mask { font-family: monospace; color: #6b7a8d; letter-spacing: 2px; }

    /* --- Responsive --- */
    @media (max-width: 1024px) {
      .stat-grid { grid-template-columns: repeat(2, 1fr); }
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
      .schedule-grid { grid-template-columns: repeat(4, 1fr); }
    }
    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.mobile-open { transform: translateX(0); }
      .main-content { margin-left: 0 !important; }
      .stat-grid { grid-template-columns: 1fr 1fr; }
      .form-row { flex-direction: column; }
      .topbar { padding: 12px 16px; }
      .page-content { padding: 16px; }
      .modal { min-width: 90vw; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    // ==================== API LAYER ====================
    const API_BASE = '';
    const TENANT = 'mas-ai';

    async function api(path, method = 'GET', body = null) {
      const opts = { method, headers: { 'Content-Type': 'application/json' } };
      if (body) opts.body = JSON.stringify(body);
      try {
        const res = await fetch(API_BASE + path, opts);
        if (!res.ok) {
          const err = await res.json().catch(() => ({ detail: res.statusText }));
          throw new Error(err.detail || err.message || `HTTP ${res.status}`);
        }
        return await res.json();
      } catch (e) {
        if (e.name === 'TypeError') throw new Error('Network error — is the server running?');
        throw e;
      }
    }

    // ==================== HELPERS ====================
    const platformIcons = {
      tiktok: '\u266A', instagram: '\uD83D\uDCF7', youtube: '\u25B6',
      linkedin: '\uD83D\uDCBC', twitter: '\uD835\uDD4F', threads: '\uD83E\uDDF5',
      pinterest: '\uD83D\uDCCC', snapchat: '\uD83D\uDC7B'
    };
    const platformIcon = (p) => platformIcons[p] || '\uD83C\uDF10';
    const dayNames = { mon: 'Mon', tue: 'Tue', wed: 'Wed', thu: 'Thu', fri: 'Fri', sat: 'Sat', sun: 'Sun' };

    function statusBadge(status) {
      if (!status) return { cls: 'badge-neutral', label: 'Unknown' };
      const s = status.toLowerCase();
      if (s === 'approved' || s === 'completed' || s === 'published') return { cls: 'badge-success', label: status };
      if (s === 'draft' || s === 'queued' || s === 'pending') return { cls: 'badge-warning', label: status };
      if (s === 'failed' || s === 'escalated' || s === 'rejected') return { cls: 'badge-error', label: status };
      return { cls: 'badge-info', label: status };
    }

    // ==================== TOAST SYSTEM ====================
    let toastId = 0;
    function ToastContainer({ toasts, onDismiss }) {
      return (
        <div className="toast-container">
          {toasts.map(t => (
            <div key={t.id} className={`toast toast-${t.type}`} onClick={() => onDismiss(t.id)}>
              {t.message}
            </div>
          ))}
        </div>
      );
    }

    // ==================== MODAL ====================
    function Modal({ show, onClose, title, children }) {
      if (!show) return null;
      return (
        <div className="modal-overlay" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
          <div className="modal">
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
              <div className="modal-title">{title}</div>
              <button className="btn btn-secondary btn-sm" onClick={onClose} style={{ minWidth: 32 }}>&times;</button>
            </div>
            {children}
          </div>
        </div>
      );
    }

    // ==================== LOADING ====================
    function Loading({ text = 'Loading...' }) {
      return <div className="loading-state"><div className="loading-spinner"></div><span>{text}</span></div>;
    }
    function Empty({ icon = '\uD83D\uDCED', text = 'Nothing here yet' }) {
      return <div className="empty-state"><div className="empty-icon">{icon}</div><div>{text}</div></div>;
    }

    // ==================== PAGE: OVERVIEW ====================
    function OverviewPage({ addToast }) {
      const [stats, setStats] = useState(null);
      const [analytics, setAnalytics] = useState(null);
      const [queue, setQueue] = useState([]);
      const [loading, setLoading] = useState(true);

      const load = useCallback(async () => {
        try {
          const [st, an, q] = await Promise.all([
            api('/api/status').catch(() => null),
            api('/api/analytics').catch(() => null),
            api('/api/queue').catch(() => ({ queue: [] })),
          ]);
          setStats(st);
          setAnalytics(an);
          setQueue(q.queue || []);
        } catch (e) {
          addToast('Failed to load overview: ' + e.message, 'error');
        }
        setLoading(false);
      }, []);

      useEffect(() => { load(); const iv = setInterval(load, 30000); return () => clearInterval(iv); }, [load]);

      const handleScanTrends = async () => {
        addToast('Scanning trends...', 'info');
        try { await api('/api/trends/scan', 'POST'); addToast('Trend scan complete', 'success'); } catch (e) { addToast('Scan failed: ' + e.message, 'error'); }
      };

      const handleFullPipeline = async () => {
        addToast('Starting full pipeline run...', 'info');
        try {
          await api('/api/pipeline/run', 'POST', { source_material: 'Latest AI trends and tools', platform: 'tiktok', mode: 'test' });
          addToast('Pipeline run complete', 'success');
          load();
        } catch (e) { addToast('Pipeline failed: ' + e.message, 'error'); }
      };

      if (loading) return <Loading text="Loading dashboard..." />;

      return (
        <div>
          {/* Stats Row */}
          <div className="stat-grid">
            <div className="stat-card">
              <div className="stat-icon">{'\uD83C\uDFAC'}</div>
              <div className="stat-value">{analytics?.videos || 0}</div>
              <div className="stat-label">Total Videos</div>
            </div>
            <div className="stat-card">
              <div className="stat-icon">{'\uD83C\uDFAF'}</div>
              <div className="stat-value">{stats?.niches || 0}</div>
              <div className="stat-label">Active Niches</div>
            </div>
            <div className="stat-card">
              <div className="stat-icon">{'\uD83D\uDCC5'}</div>
              <div className="stat-value">{stats?.platform_connections || 0}</div>
              <div className="stat-label">Platform Connections</div>
            </div>
            <div className="stat-card">
              <div className="stat-icon">{'\uD83D\uDD25'}</div>
              <div className="stat-value">{analytics?.trends_cached || 0}</div>
              <div className="stat-label">Viral Signals</div>
            </div>
          </div>

          {/* Quick Actions */}
          <div className="card mb-20">
            <div className="card-header">
              <div className="card-title">Quick Actions</div>
            </div>
            <div className="btn-group">
              <button className="btn btn-primary" onClick={() => window.__navigateTo && window.__navigateTo('studio')}>
                {'\uD83C\uDFAC'} New Video
              </button>
              <button className="btn btn-accent" onClick={handleScanTrends}>
                {'\uD83D\uDD0D'} Scan Trends
              </button>
              <button className="btn btn-teal" onClick={handleFullPipeline}>
                {'\u26A1'} Full Pipeline Run
              </button>
            </div>
          </div>

          {/* Recent Queue */}
          <div className="card">
            <div className="card-header">
              <div className="card-title">Recent Pipeline Runs</div>
              <div className="card-subtitle">{queue.length} items in queue</div>
            </div>
            {queue.length === 0 ? (
              <Empty icon={'\uD83D\uDCE6'} text="No content in queue yet. Generate some!" />
            ) : (
              <table className="data-table">
                <thead><tr><th>Script ID</th><th>Platform</th><th>Score</th><th>Status</th></tr></thead>
                <tbody>
                  {queue.slice(0, 10).map((q, i) => {
                    const sb = statusBadge(q.status);
                    return (
                      <tr key={i}>
                        <td style={{ color: '#00c8ff' }}>{q.script_id || '-'}</td>
                        <td><span className={`platform-badge ${q.platform}`}>{platformIcon(q.platform)} {q.platform}</span></td>
                        <td style={{ color: '#D4A843' }}>{q.quality_score || '-'}</td>
                        <td><span className={`badge ${sb.cls}`}>{sb.label}</span></td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            )}
          </div>
        </div>
      );
    }

    // ==================== PAGE: CONTENT STUDIO ====================
    function ContentStudioPage({ addToast }) {
      const [subTab, setSubTab] = useState('manual');
      const [topic, setTopic] = useState('');
      const [scriptText, setScriptText] = useState('');
      const [platform, setPlatform] = useState('tiktok');
      const [mode, setMode] = useState('test');
      const [generating, setGenerating] = useState(false);
      const [result, setResult] = useState(null);
      const [contentQueue, setContentQueue] = useState([]);
      const [queueLoading, setQueueLoading] = useState(true);

      const loadQueue = useCallback(async () => {
        try {
          const data = await api('/api/content/queue');
          setContentQueue(data.items || []);
        } catch { setContentQueue([]); }
        setQueueLoading(false);
      }, []);

      useEffect(() => { loadQueue(); }, [loadQueue]);

      const handleGenerateScript = async () => {
        if (!topic.trim()) { addToast('Enter a topic first', 'error'); return; }
        setGenerating(true);
        setResult(null);
        try {
          const res = await api('/api/content/manual-topic', 'POST', { topic: topic.trim(), platform, mode });
          setResult(res);
          addToast('Script generated!', 'success');
          loadQueue();
        } catch (e) { addToast('Generation failed: ' + e.message, 'error'); setResult({ status: 'error', message: e.message }); }
        setGenerating(false);
      };

      const handleScriptToVideo = async () => {
        if (!scriptText.trim()) { addToast('Paste a script first', 'error'); return; }
        setGenerating(true);
        setResult(null);
        try {
          const res = await api('/api/content/script-to-video', 'POST', { script_text: scriptText.trim(), platform, mode });
          setResult(res);
          addToast('Video production started!', 'success');
          loadQueue();
        } catch (e) { addToast('Production failed: ' + e.message, 'error'); setResult({ status: 'error', message: e.message }); }
        setGenerating(false);
      };

      const handleProduceVideo = async () => {
        if (!result?.script_text) { addToast('No script to produce', 'error'); return; }
        setGenerating(true);
        try {
          const res = await api('/api/content/script-to-video', 'POST', { script_text: result.script_text, platform, mode });
          setResult(res);
          addToast('Video produced!', 'success');
          loadQueue();
        } catch (e) { addToast('Production failed: ' + e.message, 'error'); }
        setGenerating(false);

            <div className={`tab-item ${subTab === 'script' ? 'active' : ''}`} onClick={() => setSubTab('script')}>Script-to-Video</div>
            <div className={`tab-item ${subTab === 'queue' ? 'active' : ''}`} onClick={() => setSubTab('queue')}>Content Queue</div>

              <div className="form-row mb-12">

                    <option value="instagram">Instagram</option>
                    <option value="youtube">YouTube</option>
                    <option value="linkedin">LinkedIn</option>
                    <option value="twitter">X/Twitter</option>

                </div>
                <div className="form-group" style={{ marginBottom: 0 }}>
                  <label>Mode</label>
                  <select value={mode} onChange={e => setMode(e.target.value)}>
                    <option value="test">Test (Kokoro TTS)</option>
                    <option value="production">Production (ElevenLabs)</option>
                  </select>
                </div>
              </div>
            </div>

          {/* Manual Topic Input */}

              <div className="form-group">
                <label>Topic / Source Material</label>
                <textarea rows="4" placeholder="e.g., How AI agents are replacing SaaS tools in 2026..." value={topic} onChange={e => setTopic(e.target.value)} />

              <div className="btn-group">
                <button className="btn btn-primary btn-lg" onClick={handleGenerateScript} disabled={generating}>

              {result && (
                <div className="result-box">

                  {result.script_text && (

                      <button className="btn btn-teal" onClick={handleProduceVideo} disabled={generating}>
                        {'\uD83C\uDFAC'} Produce Video
                      </button>
                    </>
                  )}
                  {result.message && <pre>{result.message}</pre>}
                </div>
              )}
            </div>
          )}

          {/* Script-to-Video */}
          {subTab === 'script' && (
            <div className="card">
              <div className="card-header"><div className="card-title">Paste Script &rarr; Produce Video</div></div>
              <div className="form-group">
                <label>Finished Script</label>
                <textarea rows="8" placeholder="Paste your finished script here. This skips the ScriptMaestro and goes directly to voice + video production..." value={scriptText} onChange={e => setScriptText(e.target.value)} />
              </div>
              <button className="btn btn-teal btn-lg" onClick={handleScriptToVideo} disabled={generating}>
                {generating ? <><div className="loading-spinner" style={{ width: 16, height: 16 }}></div> Producing...</> : <>{'\uD83C\uDFAC'} Produce Video</>}
              </button>
              {result && (
                <div className="result-box">
                  <div className="result-status" style={{ color: result.status === 'completed' ? '#2dd4bf' : '#ff6b6b' }}>
                    {result.status?.toUpperCase()}
                  </div>
                  {result.video_path && <div style={{ fontSize: 13, color: '#8899aa' }}>Video: {result.video_path}</div>}
                  {result.audio_path && <div style={{ fontSize: 13, color: '#8899aa' }}>Audio: {result.audio_path}</div>}
                  {result.message && <pre>{result.message}</pre>}
                </div>
              )}
            </div>
          )}

          {/* Content Queue */}
          {subTab === 'queue' && (
            <div className="card">
              <div className="card-header">
                <div className="card-title">Content Queue</div>
                <button className="btn btn-secondary btn-sm" onClick={loadQueue}>{'\u21BB'} Refresh</button>
              </div>
              {queueLoading ? <Loading /> : contentQueue.length === 0 ? (
                <Empty icon={'\uD83D\uDCDD'} text="No content items yet. Generate some from the Manual Topic tab!" />
              ) : (
                <table className="data-table">
                  <thead><tr><th>ID</th><th>Topic</th><th>Platform</th><th>Stage</th><th>Score</th><th>Status</th></tr></thead>

                    {contentQueue.map((item, i) => {
                      const sb = statusBadge(item.status);
                      return (
                        <tr key={i}>
                          <td style={{ color: '#00c8ff', fontSize: 12, fontFamily: 'monospace' }}>{item.id?.slice(0, 12)}</td>
                          <td style={{ maxWidth: 200, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{item.topic || '-'}</td>
                          <td><span className={`platform-badge ${item.platform}`}>{platformIcon(item.platform)} {item.platform}</span></td>
                          <td><span className="badge badge-info">{item.stage}</span></td>

    // ==================== PAGE: NICHES & PLATFORMS ====================
    function NichesPage({ addToast }) {
      const [tenant, setTenant] = useState(null);
      const [regions, setRegions] = useState({});
      const [loading, setLoading] = useState(true);
      const [showNicheModal, setShowNicheModal] = useState(false);
      const [showPlatformModal, setShowPlatformModal] = useState(false);
      const [selectedNicheSlug, setSelectedNicheSlug] = useState('');

      // Niche form
      const [nicheName, setNicheName] = useState('');
      const [nicheAudience, setNicheAudience] = useState('');
      const [nicheDescription, setNicheDescription] = useState('');
      const [nicheHashtags, setNicheHashtags] = useState('');
      const [nicheTone, setNicheTone] = useState('expert_accessible');

      // Platform form
      const [platType, setPlatType] = useState('tiktok');
      const [platHandle, setPlatHandle] = useState('');
      const [platRegion, setPlatRegion] = useState('canada_east');
      const [platPPW, setPlatPPW] = useState(3);

      const load = useCallback(async () => {
        try {
          const [t, r] = await Promise.all([
            api(`/api/tenant/${TENANT}`),
            api('/api/regions'),
          ]);
          setTenant(t);
          setRegions(r.regions || {});
        } catch (e) { addToast('Failed to load: ' + e.message, 'error'); }
        setLoading(false);
      }, []);

      useEffect(() => { load(); }, [load]);

      const createNiche = async () => {
        if (!nicheName.trim()) { addToast('Niche name required', 'error'); return; }
        try {
          await api(`/api/tenant/${TENANT}/niche`, 'POST', {
            name: nicheName, target_audience: nicheAudience, description: nicheDescription,
            hashtags: nicheHashtags.split(',').map(h => h.trim()).filter(Boolean), tone: nicheTone,
          });
          addToast(`Niche "${nicheName}" created`, 'success');
          setShowNicheModal(false);
          setNicheName(''); setNicheAudience(''); setNicheDescription(''); setNicheHashtags('');
          load();
        } catch (e) { addToast('Create failed: ' + e.message, 'error'); }
      };

      const deleteNiche = async (slug) => {
        if (!confirm(`Delete niche "${slug}" and all its platform connections?`)) return;
        try {
          await api(`/api/tenant/${TENANT}/niche/${slug}`, 'DELETE');
          addToast('Niche deleted', 'success');
          load();
        } catch (e) { addToast('Delete failed: ' + e.message, 'error'); }
      };

      const connectPlatform = async () => {
        try {
          const res = await api(`/api/tenant/${TENANT}/niche/${selectedNicheSlug}/platform`, 'POST', {
            platform: platType, handle: platHandle, region: platRegion, posts_per_week: platPPW,
          });
          addToast(`${platType} connected!`, 'success');
          setShowPlatformModal(false);
          setPlatHandle('');
          load();
        } catch (e) { addToast('Connect failed: ' + e.message, 'error'); }
      };

      const removePlatform = async (nicheSlug, platformId) => {
        if (!confirm('Disconnect this platform?')) return;
        try {
          await api(`/api/tenant/${TENANT}/niche/${nicheSlug}/platform/${platformId}`, 'DELETE');
          addToast('Platform disconnected', 'success');
          load();
        } catch (e) { addToast('Failed: ' + e.message, 'error'); }
      };

      if (loading) return <Loading />;

      const niches = tenant?.niches || [];

      return (
        <div>
          <div className="card-header" style={{ marginBottom: 16 }}>
            <div className="card-title">Niches & Platform Connections</div>
            <button className="btn btn-primary" onClick={() => setShowNicheModal(true)}>{'\u2795'} Add Niche</button>
          </div>

          {niches.length === 0 ? (
            <div className="card"><Empty icon={'\uD83C\uDFAF'} text='No niches yet. Click "+ Add Niche" to get started.' /></div>
          ) : (
            niches.map(niche => (
              <div className="niche-card" key={niche.slug || niche.id}>
                <div className="niche-header">
                  <div>
                    <div className="niche-name">{niche.name}</div>
                    <div className="niche-audience">{niche.target_audience || 'No audience defined'}</div>
                    {niche.description && <div style={{ fontSize: 12, color: '#556', marginTop: 4 }}>{niche.description}</div>}
                  </div>
                  <div className="btn-group">
                    <button className="btn btn-primary btn-sm" onClick={() => { setSelectedNicheSlug(niche.slug); setShowPlatformModal(true); }}>
                      {'\u2795'} Platform
                    </button>
                    <button className="btn btn-danger btn-sm" onClick={() => deleteNiche(niche.slug)}>Remove</button>
                  </div>
                </div>
                <div className="niche-platforms">
                  {(niche.platforms || []).length === 0 ? (
                    <span style={{ color: '#4a5568', fontSize: 12 }}>No platforms connected</span>
                  ) : (
                    (niche.platforms || []).map(p => (
                      <span className={`platform-badge ${p.platform}`} key={p.id} style={{ cursor: 'default' }}>
                        {platformIcon(p.platform)} {p.platform} {p.handle}
                        <span style={{ opacity: 0.5, marginLeft: 4 }}>{p.posts_per_week}/wk</span>
                        <span style={{ opacity: 0.4, cursor: 'pointer', marginLeft: 4 }} onClick={() => removePlatform(niche.slug, p.id)}>&times;</span>
                      </span>
                    ))
                  )}
                </div>
              </div>
            ))
          )}

          {/* Add Niche Modal */}
          <Modal show={showNicheModal} onClose={() => setShowNicheModal(false)} title="Add New Niche">
            <div className="form-group"><label>Niche Name</label><input placeholder="e.g., AI Tech, Fitness, Cooking" value={nicheName} onChange={e => setNicheName(e.target.value)} /></div>
            <div className="form-group"><label>Target Audience</label><input placeholder="e.g., AI founders, gym enthusiasts" value={nicheAudience} onChange={e => setNicheAudience(e.target.value)} /></div>
            <div className="form-group"><label>Description</label><textarea rows="2" placeholder="Brief description of this niche..." value={nicheDescription} onChange={e => setNicheDescription(e.target.value)} /></div>
            <div className="form-group"><label>Hashtags (comma-separated)</label><input placeholder="#AITools, #TechStartup" value={nicheHashtags} onChange={e => setNicheHashtags(e.target.value)} /></div>
            <div className="form-group">
              <label>Tone</label>
              <select value={nicheTone} onChange={e => setNicheTone(e.target.value)}>
                <option value="expert_accessible">Expert but Accessible</option>
                <option value="casual">Casual / Friendly</option>
                <option value="professional">Professional</option>
                <option value="edgy">Edgy / Bold</option>
                <option value="educational">Educational</option>
              </select>
            </div>
            <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
              <button className="btn btn-secondary" onClick={() => setShowNicheModal(false)}>Cancel</button>
              <button className="btn btn-primary" onClick={createNiche}>Create Niche</button>
            </div>
          </Modal>

          {/* Add Platform Modal */}
          <Modal show={showPlatformModal} onClose={() => setShowPlatformModal(false)} title="Connect Platform">
            <div className="form-group">
              <label>Platform</label>
              <select value={platType} onChange={e => setPlatType(e.target.value)}>
                {['tiktok','instagram','youtube','linkedin','twitter','threads','pinterest','snapchat'].map(p => (
                  <option key={p} value={p}>{platformIcon(p)} {p.charAt(0).toUpperCase() + p.slice(1)}</option>
                ))}
              </select>
            </div>
            <div className="form-group"><label>Handle</label><input placeholder="@username" value={platHandle} onChange={e => setPlatHandle(e.target.value)} /></div>
            <div className="form-row">
              <div className="form-group">
                <label>Audience Region</label>
                <select value={platRegion} onChange={e => setPlatRegion(e.target.value)}>
                  {Object.entries(regions).map(([key, val]) => (
                    <option key={key} value={key}>{val.label} ({val.timezone})</option>
                  ))}
                </select>
              </div>
              <div className="form-group">
                <label>Posts / Week</label>
                <input type="number" min="1" max="14" value={platPPW} onChange={e => setPlatPPW(parseInt(e.target.value) || 3)} />
              </div>
            </div>
            <p style={{ fontSize: 11, color: '#556', marginBottom: 16 }}>Posting times auto-calculate based on region and platform best practices.</p>
            <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
              <button className="btn btn-secondary" onClick={() => setShowPlatformModal(false)}>Cancel</button>
              <button className="btn btn-primary" onClick={connectPlatform}>Connect</button>
            </div>
          </Modal>
        </div>
      );
    }

    // ==================== PAGE: DISTRIBUTION ====================
    function DistributionPage({ addToast }) {
      const [schedule, setSchedule] = useState([]);
      const [totalSlots, setTotalSlots] = useState(0);
      const [trends, setTrends] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        (async () => {
          try {
            const [sc, tr] = await Promise.all([
              api(`/api/tenant/${TENANT}/schedule`),
              api('/api/trends').catch(() => ({ trends: [] })),
            ]);
            setSchedule(sc.schedule || []);
            setTotalSlots(sc.total_slots || 0);
            setTrends(tr.trends || []);
          } catch (e) { addToast('Load failed: ' + e.message, 'error'); }
          setLoading(false);
        })();
      }, []);

      if (loading) return <Loading />;

      const days = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
      const byDay = {};
      days.forEach(d => byDay[d] = []);
      schedule.forEach(s => { if (byDay[s.day]) byDay[s.day].push(s); });

      return (
        <div>
          {/* Schedule Calendar */}
          <div className="card mb-20">
            <div className="card-header">
              <div><div className="card-title">Weekly Schedule</div><div className="card-subtitle">{totalSlots} posting slots per week</div></div>
            </div>
            {totalSlots === 0 ? (
              <Empty icon={'\uD83D\uDCC5'} text="No schedule yet. Add niches and platforms first." />
            ) : (
              <div className="schedule-grid">
                {days.map(day => (
                  <div className="schedule-day" key={day}>
                    <div className="day-label">{dayNames[day]}</div>
                    {byDay[day].length === 0 ? (
                      <div style={{ fontSize: 10, color: '#333', marginTop: 8 }}>--</div>
                    ) : (
                      byDay[day].map((slot, i) => (
                        <div key={i} className={`schedule-slot platform-badge ${slot.platform}`} style={{ display: 'block', textAlign: 'center' }}>
                          {slot.time}
                        </div>
                      ))
                    )}
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* Trending Topics */}
          <div className="card">
            <div className="card-header">
              <div className="card-title">Trending Topics</div>
              <button className="btn btn-secondary btn-sm" onClick={async () => {
                addToast('Scanning trends...', 'info');
                try { await api('/api/trends/scan', 'POST'); addToast('Scan complete', 'success'); window.location.reload(); }
                catch (e) { addToast('Scan failed: ' + e.message, 'error'); }
              }}>{'\uD83D\uDD0D'} Scan Now</button>
            </div>
            {trends.length === 0 ? (
              <Empty icon={'\uD83D\uDCA1'} text='No trends cached. Click "Scan Now" to discover trending topics.' />
            ) : (
              <div>
                {trends.slice(0, 15).map((t, i) => (
                  <div key={i} style={{ padding: '10px 0', borderBottom: '1px solid #1e213050', cursor: 'pointer' }}
                       onClick={() => { window.__navigateTo && window.__navigateTo('studio'); }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                      <span style={{ fontSize: 11, color: '#00c8ff', textTransform: 'uppercase' }}>{t.source}</span>
                      <span style={{ color: '#D4A843', fontSize: 12 }}>{t.relevance_score}/10</span>
                    </div>
                    <div style={{ fontSize: 14, marginTop: 2 }}>{t.title}</div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    // ==================== PAGE: SETTINGS ====================
    function SettingsPage({ addToast }) {
      const [tenant, setTenant] = useState(null);
      const [loading, setLoading] = useState(true);
      const [saving, setSaving] = useState(false);

      // Form state
      const [displayName, setDisplayName] = useState('');
      const [avatarName, setAvatarName] = useState('');
      const [brandColor, setBrandColor] = useState('#00c8ff');
      const [tagline, setTagline] = useState('');
      const [personaName, setPersonaName] = useState('');
      const [personaTone, setPersonaTone] = useState('');
      const [personaPersonality, setPersonaPersonality] = useState('');
      const [voiceProvider, setVoiceProvider] = useState('kokoro');
      const [voiceId, setVoiceId] = useState('');

      useEffect(() => {
        (async () => {
          try {
            const t = await api(`/api/tenant/${TENANT}`);
            setTenant(t);
            setDisplayName(t.display_name || '');
            setAvatarName(t.avatar_name || '');
            setBrandColor(t.brand_color || '#00c8ff');
            setTagline(t.tagline || '');
            setPersonaName(t.persona_name || '');
            setPersonaTone(t.persona_tone || '');
            setPersonaPersonality(t.persona_personality || '');
            setVoiceProvider(t.voice_provider || 'kokoro');
            setVoiceId(t.voice_id || '');
          } catch (e) { addToast('Load failed: ' + e.message, 'error'); }
          setLoading(false);
        })();
      }, []);

      const handleSave = async () => {
        setSaving(true);
        try {
          await api(`/api/tenant/${TENANT}`, 'PUT', {
            display_name: displayName, avatar_name: avatarName, brand_color: brandColor,
            tagline: tagline, persona_name: personaName, persona_tone: personaTone,
            persona_personality: personaPersonality, voice_provider: voiceProvider, voice_id: voiceId,
          });
          addToast('Settings saved', 'success');
        } catch (e) { addToast('Save failed: ' + e.message, 'error'); }
        setSaving(false);
      };

      if (loading) return <Loading />;

      return (
        <div>
          <div className="grid-2 mb-20">
            {/* Tenant Config */}
            <div className="card">
              <div className="card-header"><div className="card-title">Tenant Configuration</div></div>
              <div className="form-group"><label>Display Name</label><input value={displayName} onChange={e => setDisplayName(e.target.value)} /></div>
              <div className="form-group"><label>Avatar / Brand Name</label><input value={avatarName} onChange={e => setAvatarName(e.target.value)} /></div>
              <div className="form-group"><label>Brand Color</label>
                <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
                  <input type="color" value={brandColor} onChange={e => setBrandColor(e.target.value)} style={{ width: 48, height: 36, padding: 2, cursor: 'pointer' }} />
                  <input value={brandColor} onChange={e => setBrandColor(e.target.value)} style={{ flex: 1 }} />
                </div>
              </div>
              <div className="form-group"><label>Tagline</label><input value={tagline} onChange={e => setTagline(e.target.value)} placeholder="e.g., Governed AI That Gets Things Done" /></div>
            </div>

            {/* Persona */}
            <div className="card">
              <div className="card-header"><div className="card-title">Persona Settings</div></div>
              <div className="form-group"><label>Persona Name</label><input value={personaName} onChange={e => setPersonaName(e.target.value)} /></div>
              <div className="form-group"><label>Tone</label>
                <select value={personaTone} onChange={e => setPersonaTone(e.target.value)}>
                  <option value="">-- Select --</option>
                  <option value="Expert but accessible, founder energy, not corporate">Expert + Founder Energy</option>
                  <option value="Casual, friendly, conversational">Casual + Friendly</option>
                  <option value="Professional, polished, authoritative">Professional</option>
                  <option value="Edgy, bold, contrarian">Edgy + Bold</option>
                  <option value="Educational, clear, structured">Educational</option>
                </select>
              </div>
              <div className="form-group"><label>Personality</label><textarea rows="3" value={personaPersonality} onChange={e => setPersonaPersonality(e.target.value)} placeholder="e.g., Confident, intellectually sharp, slightly witty, data-driven" /></div>
            </div>
          </div>

          <div className="grid-2 mb-20">
            {/* Voice */}
            <div className="card">
              <div className="card-header"><div className="card-title">Voice Provider</div></div>
              <div className="form-group"><label>Provider</label>
                <select value={voiceProvider} onChange={e => setVoiceProvider(e.target.value)}>
                  <option value="kokoro">Kokoro TTS (Free / Local)</option>
                  <option value="elevenlabs">ElevenLabs (Production)</option>
                  <option value="f5tts">F5-TTS (Local)</option>
                </select>
              </div>
              <div className="form-group"><label>Voice ID</label>
                <input value={voiceId} onChange={e => setVoiceId(e.target.value)} placeholder="ElevenLabs voice ID or local model path" />
              </div>
            </div>

            {/* API Keys */}
            <div className="card">
              <div className="card-header"><div className="card-title">API Keys</div><div className="card-subtitle">Stored in credentials.env (gitignored)</div></div>
              <div className="form-group">
                <label>ElevenLabs API Key</label>
                <div className="key-mask" style={{ padding: '10px 14px', background: '#181b28', borderRadius: 8, border: '1px solid #2a2f3e' }}>
                  {tenant?.voice_id ? '\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022' : 'Not configured'}
                </div>
              </div>
              <div className="form-group">
                <label>Ollama Endpoint</label>
                <div className="key-mask" style={{ padding: '10px 14px', background: '#181b28', borderRadius: 8, border: '1px solid #2a2f3e' }}>
                  http://localhost:11434 (local)
                </div>
              </div>
              <p style={{ fontSize: 11, color: '#4a5568' }}>API keys are managed in the credentials.env file. Never expose keys in the dashboard.</p>
            </div>
          </div>

          <div style={{ display: 'flex', justifyContent: 'flex-end' }}>
            <button className="btn btn-primary btn-lg" onClick={handleSave} disabled={saving}>
              {saving ? 'Saving...' : 'Save Settings'}
            </button>
          </div>
        </div>
      );
    }

    // ==================== POST HISTORY PAGE ====================
    function PostHistoryPage({ addToast }) {
      const [posts, setPosts] = useState([]);
      const [summary, setSummary] = useState(null);
      const [loading, setLoading] = useState(true);
      const [platformFilter, setPlatformFilter] = useState('');
      const [collecting, setCollecting] = useState(false);
      const [cleaning, setCleaning] = useState(false);

      const loadData = async () => {
        try {
          const params = platformFilter ? `?platform=${platformFilter}&limit=50` : '?limit=50';
          const [historyRes, analyticsRes] = await Promise.all([
            api(`/api/posts/history${params}`).catch(() => ({ posts: [], total: 0 })),
            api(`/api/analytics/posts?limit=50${platformFilter ? '&platform=' + platformFilter : ''}`).catch(() => ({ posts: [], summary: {} })),
          ]);
          // Merge analytics into history
          const metricsMap = {};
          (analyticsRes.posts || []).forEach(p => { metricsMap[p.id] = p; });
          const merged = (historyRes.posts || []).map(p => ({
            ...p,
            views: metricsMap[p.id]?.views || 0,
            likes: metricsMap[p.id]?.likes || 0,
            comments: metricsMap[p.id]?.comments || 0,
            viral_signal: metricsMap[p.id]?.viral_signal || null,
          }));
          setPosts(merged);
          setSummary(analyticsRes.summary || { total_posts: historyRes.total, total_views: 0, total_likes: 0, viral_posts: 0 });
        } catch (e) { addToast('Load failed: ' + e.message, 'error'); }
        setLoading(false);
      };

      useEffect(() => { setLoading(true); loadData(); }, [platformFilter]);

      const handleCollect = async () => {
        setCollecting(true);
        try {
          const res = await api('/api/analytics/collect', 'POST');
          addToast(`Collected metrics for ${res.total_collected || 0} posts`, 'success');
          loadData();
        } catch (e) { addToast('Collection failed: ' + e.message, 'error'); }
        setCollecting(false);
      };

      const handleCleanup = async () => {
        setCleaning(true);
        try {
          const res = await api('/api/posts/cleanup?days=3', 'POST');
          addToast(`Cleaned ${res.files_deleted} files (${res.bytes_freed_mb} MB freed)`, 'success');
        } catch (e) { addToast('Cleanup failed: ' + e.message, 'error'); }
        setCleaning(false);
      };

      const platforms = ['', 'instagram', 'tiktok', 'youtube', 'twitter', 'linkedin'];

      if (loading) return <Loading />;

      return (
        <div>
          {/* Summary stats */}
          <div className="stat-grid mb-20">
            <div className="stat-card"><div className="stat-icon">{'\uD83D\uDCE4'}</div><div className="stat-value">{summary?.total_posts || 0}</div><div className="stat-label">Total Posts</div></div>
            <div className="stat-card"><div className="stat-icon">{'\uD83D\uDC41\uFE0F'}</div><div className="stat-value">{(summary?.total_views || 0).toLocaleString()}</div><div className="stat-label">Total Views</div></div>
            <div className="stat-card"><div className="stat-icon">{'\u2764\uFE0F'}</div><div className="stat-value">{(summary?.total_likes || 0).toLocaleString()}</div><div className="stat-label">Total Likes</div></div>
            <div className="stat-card"><div className="stat-icon">{'\uD83D\uDD25'}</div><div className="stat-value">{summary?.viral_posts || 0}</div><div className="stat-label">Viral Posts</div></div>
          </div>

          {/* Controls */}
          <div className="card mb-20">
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 12 }}>
              <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
                <label style={{ margin: 0 }}>Platform:</label>
                <select value={platformFilter} onChange={e => setPlatformFilter(e.target.value)} style={{ width: 160 }}>
                  {platforms.map(p => <option key={p} value={p}>{p || 'All Platforms'}</option>)}
                </select>
              </div>
              <div className="btn-group">
                <button className="btn btn-teal btn-sm" onClick={handleCollect} disabled={collecting}>
                  {collecting ? 'Collecting...' : '\uD83D\uDCE1 Collect Metrics'}
                </button>
                <button className="btn btn-danger btn-sm" onClick={handleCleanup} disabled={cleaning}>
                  {cleaning ? 'Cleaning...' : '\uD83E\uDDF9 Cleanup Old Renders'}
                </button>
              </div>
            </div>
          </div>

          {/* Post table */}
          <div className="card">
            <div className="card-header">
              <div className="card-title">Post History</div>
              <div className="card-subtitle">{posts.length} posts shown</div>
            </div>
            {posts.length === 0 ? (
              <Empty icon={'\uD83D\uDCE4'} text="No posts yet. Create content in the Studio!" />
            ) : (
              <div style={{ overflowX: 'auto' }}>
                <table className="data-table">
                  <thead>
                    <tr>
                      <th>Platform</th>
                      <th>Date</th>
                      <th>Caption</th>
                      <th>Views</th>
                      <th>Likes</th>
                      <th>Comments</th>
                      <th>Status</th>
                      <th>Link</th>
                    </tr>
                  </thead>
                  <tbody>
                    {posts.map((p, i) => (
                      <tr key={i} style={p.viral_signal ? { borderLeft: '3px solid #D4A843' } : {}}>
                        <td><span className={`platform-badge ${p.platform}`}>{platformIcon(p.platform)} {p.platform}</span></td>
                        <td style={{ whiteSpace: 'nowrap', fontSize: 12, color: '#8899aa' }}>
                          {p.published_at ? new Date(p.published_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '-'}
                        </td>
                        <td style={{ maxWidth: 300, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', fontSize: 13 }}>
                          {p.caption || '-'}
                          {p.viral_signal && <span style={{ marginLeft: 6, color: '#D4A843', fontSize: 11 }}>{'\uD83D\uDD25'} VIRAL</span>}
                        </td>
                        <td>{(p.views || 0).toLocaleString()}</td>
                        <td>{(p.likes || 0).toLocaleString()}</td>
                        <td>{(p.comments || 0).toLocaleString()}</td>
                        <td><span className={`badge ${p.status === 'published' ? 'badge-success' : p.status === 'duplicate' ? 'badge-warning' : 'badge-info'}`}>{p.status}</span></td>
                        <td>{p.url ? <a href={p.url} target="_blank" rel="noopener" style={{ color: '#00c8ff', fontSize: 12 }}>View</a> : '-'}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ==================== APP ROOT ====================
    function App() {
      const [currentPage, setCurrentPage] = useState('overview');
      const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
      const [mobileOpen, setMobileOpen] = useState(false);
      const [toasts, setToasts] = useState([]);
      const [systemStatus, setSystemStatus] = useState('Loading...');

      // Expose navigation for cross-component use
      window.__navigateTo = setCurrentPage;

      const addToast = useCallback((message, type = 'info') => {
        const id = ++toastId;
        setToasts(prev => [...prev, { id, message, type }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 4000);
      }, []);

      const dismissToast = useCallback((id) => {
        setToasts(prev => prev.filter(t => t.id !== id));
      }, []);

      // Load system status
      useEffect(() => {
        const loadStatus = async () => {
          try {
            const data = await api('/api/status');
            setSystemStatus(`${data.tenants} tenants | ${data.niches} niches | ${data.platform_connections} platforms`);
          } catch { setSystemStatus('Offline'); }
        };
        loadStatus();
        const iv = setInterval(loadStatus, 30000);
        return () => clearInterval(iv);
      }, []);

      const navItems = [
        { id: 'overview', icon: '\uD83D\uDCCA', label: 'Overview' },
        { id: 'studio', icon: '\uD83C\uDFAC', label: 'Content Studio' },
        { id: 'niches', icon: '\uD83C\uDFAF', label: 'Niches & Platforms' },
        { id: 'analytics', icon: '\uD83D\uDCC8', label: 'Analytics' },
        { id: 'distribution', icon: '\uD83D\uDE80', label: 'Distribution' },
        { id: 'history', icon: '\uD83D\uDCCB', label: 'Post History' },
        { id: 'settings', icon: '\u2699\uFE0F', label: 'Settings' },
      ];

      const pageTitle = navItems.find(n => n.id === currentPage)?.label || 'Dashboard';

      const renderPage = () => {
        switch (currentPage) {
          case 'overview': return <OverviewPage addToast={addToast} />;
          case 'studio': return <ContentStudioPage addToast={addToast} />;
          case 'niches': return <NichesPage addToast={addToast} />;
          case 'analytics': return <AnalyticsPage addToast={addToast} />;
          case 'distribution': return <DistributionPage addToast={addToast} />;
          case 'history': return <PostHistoryPage addToast={addToast} />;
          case 'settings': return <SettingsPage addToast={addToast} />;
          default: return <OverviewPage addToast={addToast} />;
        }
      };

      return (
        <div className="app-layout">
          {/* Sidebar */}
          <aside className={`sidebar ${sidebarCollapsed ? 'collapsed' : ''} ${mobileOpen ? 'mobile-open' : ''}`}>
            <button className="collapse-btn" onClick={() => { setSidebarCollapsed(!sidebarCollapsed); setMobileOpen(false); }}>
              {sidebarCollapsed ? '\u25B6' : '\u25C0'}
            </button>
            <div className="brand">
              <div className="brand-name">ContentOps</div>
              <div className="brand-sub">AI Media Agency</div>
            </div>
            <nav>
              {navItems.map(item => (
                <div
                  key={item.id}
                  className={`nav-item ${currentPage === item.id ? 'active' : ''}`}
                  onClick={() => { setCurrentPage(item.id); setMobileOpen(false); }}
                >
                  <span className="nav-icon">{item.icon}</span>
                  <span className="nav-label">{item.label}</span>
                </div>
              ))}
            </nav>
            <div className="sidebar-footer">
              <span>v2.0 | MAS-AI</span>
            </div>
          </aside>

          {/* Main */}
          <main className={`main-content ${sidebarCollapsed ? 'expanded' : ''}`}>
            <div className="topbar">
              <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                <button className="btn btn-secondary btn-sm" onClick={() => setMobileOpen(!mobileOpen)} style={{ display: 'none' }}>{'\u2630'}</button>
                <h1>{pageTitle}</h1>
              </div>
              <div className="status-pill">{systemStatus}</div>
            </div>
            <div className="page-content">
              {renderPage()}
            </div>
          </main>

          {/* Toasts */}
          <ToastContainer toasts={toasts} onDismiss={dismissToast} />
        </div>
      );
    }

    // Mount
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
